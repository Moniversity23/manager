<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gaffer</title>
<meta name="theme-color" content="#080c14">
<meta name="description" content="Football management: start at the bottom, climb every division, win the Golden Ball. Plays offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Gaffer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--s1:#0d1520;--s2:#111d2e;--s3:#162438;--bd:#1e3050;--bd2:#2a4468;--tx:#dde8f5;--dim:#7d98b6;--mut:#3d5a78;--gr:#00e676;--bl:#4da6ff;--rd:#ff5252;--or:#ffab40;--yw:#ffd740;--ac:#00e5cc;--gold:#ffd700;--fn:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'Space Mono',monospace;--r:8px;--rl:12px;--tbh:52px;--bbh:60px}
:root[data-theme="light"]{--bg:#eef2f7;--s1:#ffffff;--s2:#f4f7fb;--s3:#e3e9f1;--bd:#cfd9e6;--bd2:#b5c4d6;--tx:#14202e;--dim:#4f6378;--mut:#7d8ea1;--gr:#00873f;--bl:#1f6fd1;--rd:#d32f2f;--or:#c76a00;--yw:#9a7a00;--ac:#00897b;--gold:#a87b00}
:root[data-theme="light"] .card,:root[data-theme="light"] .kpi{background:#fff}
:root[data-theme="light"] .sb{background:#f7f9fc}
:root[data-theme="light"] .tb,:root[data-theme="light"] #bottomBar{background:rgba(255,255,255,.97)!important}
:root[data-theme="light"] .mbox{background:#fff}
:root[data-theme="light"] .pitch{background:linear-gradient(180deg,#2e7d4f,#256b42)}
:root[data-theme="light"] .pslot{background:rgba(255,255,255,.85);color:#14202e}
:root[data-theme="light"] .welcome,:root[data-theme="light"] #loading{background:var(--bg)}
html[data-size="large"]{font-size:16px}
*{box-sizing:border-box;margin:0;padding:0}
.mv-wrap{position:relative;background:#0f3d24;border-radius:12px;overflow:hidden}
.mv-canvas{display:block;width:100%;height:auto}
.mv-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px;flex-wrap:wrap}
.mv-score{font-family:var(--fn);font-size:26px;font-weight:900;letter-spacing:.03em}
.mv-clock{font-family:var(--fm);font-size:14px;color:var(--ac)}
.mv-feed{max-height:150px;overflow-y:auto;font-size:12px;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin-top:8px}
.mv-feed div{padding:2px 0;border-bottom:1px solid rgba(127,127,127,.12)}
.mv-stats{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
.mv-stats .l{text-align:right}.mv-stats .c{color:var(--dim);text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.meter{height:8px;background:var(--s3);border-radius:5px;overflow:hidden}.meter>span{display:block;height:100%}
.mv3d{position:relative;width:100%;aspect-ratio:16/9;background:#0b2a18;border-radius:12px;overflow:hidden}
.mv3d canvas:not(.mv-radar){display:block;width:100%!important;height:100%!important}
@media(max-width:640px){.mv3d{aspect-ratio:3/2}}
.mv-flash{position:absolute;left:0;right:0;top:8%;text-align:center;font-family:var(--fn);font-size:52px;font-weight:900;line-height:1;color:#ffd740;text-shadow:0 4px 18px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity .25s;z-index:2}
.mv-flash small{display:block;font-family:var(--fb);font-size:15px;font-weight:600;color:#fff;margin-top:4px}
.mv-label{position:absolute;transform:translate(-50%,-100%);font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:1}
.mv-flash.on{opacity:1}
.mv-cam{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.mv-cam button{background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px}
.mvx .mv-bar{display:none}
.mv3d{cursor:default}
.mv-bug{position:absolute;left:8px;top:8px;display:flex;align-items:stretch;height:26px;border-radius:5px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.45);font-family:var(--fn);font-weight:800;font-size:16px;z-index:3;pointer-events:none}
.mv-bug .bt{display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(180deg,#1b2436,#0b1120);color:#fff;letter-spacing:.05em}
.mv-bug .bt i{width:4px;height:16px;border-radius:2px;background:var(--k)}
.mv-bug .bs{display:flex;align-items:center;justify-content:center;padding:0 9px;background:#fff;color:#0b1220;font-size:17px;min-width:46px}
.mv-bug .bs.pop{animation:bugpop .6s ease}
.mv-bug .bc{display:flex;align-items:center;padding:0 8px;background:var(--ac);color:#04221d;font-family:var(--fm);font-size:12px;font-weight:700}
@keyframes bugpop{0%{transform:scale(1)}30%{transform:scale(1.35);background:#ffd740}100%{transform:scale(1)}}
.mv-radar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:126px;height:81px;border-radius:6px;background:rgba(14,48,26,.6);border:1px solid rgba(255,255,255,.3);z-index:2;pointer-events:none}
.mv-replay{position:absolute;left:10px;bottom:10px;padding:4px 10px 4px 22px;background:#d61f2c;color:#fff;font-family:var(--fn);font-weight:900;letter-spacing:.14em;font-size:14px;border-radius:4px;opacity:0;transition:opacity .2s;z-index:3;pointer-events:none}
.mv-replay::before{content:'';position:absolute;left:8px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
.mv-replay.on{opacity:1}
.mv-cap{position:absolute;left:50%;transform:translateX(-50%);max-width:86%;padding:4px 10px;border-radius:6px;background:rgba(6,10,18,.72);color:#fff;font-size:12px;line-height:1.35;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:3}
.mv-cap.on{opacity:1}.mv-cap.pa{color:#ffe28a;font-style:italic}.mv3d .mv-cap.top{top:42px;bottom:auto;z-index:5}.mv3d:has(.mv-intro.on) .mv-cap{top:42px;bottom:auto;z-index:5}
.mv3d .mv-cap{bottom:96px}.mv-wrap .mv-cap{bottom:8px}
@media(max-width:640px){.mv3d .mv-cap{bottom:70px;font-size:11px}}
@keyframes blink{50%{opacity:0}}
.mv-intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,rgba(4,8,18,.15),rgba(4,8,18,.55));opacity:0;pointer-events:none;transition:opacity .4s;z-index:4}
.mv-intro.on{opacity:1}
.mi-comp{font-family:var(--fn);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#cfe;background:rgba(0,0,0,.45);padding:3px 12px;border-radius:12px}
.mi-row{display:flex;align-items:center;gap:14px}
.mi-t{display:flex;flex-direction:column;align-items:center;min-width:110px;padding:10px 14px;background:rgba(8,12,24,.82);border-bottom:4px solid var(--k);border-radius:8px;animation:mislide .7s cubic-bezier(.2,1.3,.4,1) both}
.mi-t:last-child{animation-name:mislider}
.mi-t b{font-family:var(--fn);font-size:34px;line-height:1;color:#fff;letter-spacing:.05em}.mi-t span{font-size:11px;color:#bcd;max-width:130px;text-align:center}
.mi-vs{font-family:var(--fn);font-weight:900;font-size:30px;color:#ffd740;text-shadow:0 3px 12px rgba(0,0,0,.6);animation:goalpop .7s .25s both}
.mi-tap{font-size:10px;color:rgba(255,255,255,.7);margin-top:4px}
@keyframes mislide{from{transform:translateX(-60px);opacity:0}}@keyframes mislider{from{transform:translateX(60px);opacity:0}}
.mv-flash.on{animation:goalpop .65s cubic-bezier(.2,1.6,.4,1)}
.mv-flash{background:linear-gradient(180deg,#fff6b0,#ffc400 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.mv-flash small{-webkit-text-fill-color:#fff}
@keyframes goalpop{0%{transform:scale(.2) rotate(-8deg);opacity:0}60%{transform:scale(1.15) rotate(2deg);opacity:1}100%{transform:scale(1)}}
.mv-cam button{min-height:30px}
.mv3d.mv-max{position:fixed;inset:0;z-index:300;aspect-ratio:auto;border-radius:0;width:100vw;height:100vh;height:100dvh}
.mv3d:fullscreen{aspect-ratio:auto;border-radius:0;width:100%;height:100%}
.mv-label{background:linear-gradient(180deg,#1b2436,#0b1120);border:1px solid rgba(255,255,255,.25);font-family:var(--fn);font-size:13px;letter-spacing:.04em}
@media(max-width:640px){.mv-radar{width:92px;height:59px}.mv-bug{height:22px;font-size:13px}.mv-bug .bs{font-size:14px;min-width:38px}.mv-bug .bc{font-size:10px}.mi-t{min-width:84px;padding:7px 9px}.mi-t b{font-size:24px}.mi-vs{font-size:22px}}

.ac-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(127,127,127,.14);flex-wrap:wrap}
.ac-item:last-child{border-bottom:none}
.ac-ico{font-size:17px;width:24px;text-align:center}
.ac-txt{flex:1;min-width:150px;font-size:12.5px}
.news-lead{font-family:var(--fn);font-size:24px;font-weight:900;line-height:1.1;margin-bottom:6px}
.news-item{padding:10px 0;border-bottom:1px solid rgba(127,127,127,.15)}
.news-item h4{font-size:14px;margin-bottom:3px}
.news-kind{font-family:var(--fm);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.pq{padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
.pq-a{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;font-size:12.5px}
.pq-a.sel{border-color:var(--ac);background:rgba(0,229,204,.1)}
.pq-a small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.mode-pill{font-family:var(--fm);font-size:10px;padding:3px 8px;border-radius:10px;background:var(--s3);color:var(--or);margin-left:6px}
.kbd{font-family:var(--fm);font-size:10px;padding:1px 6px;border:1px solid var(--bd2);border-radius:4px;background:var(--s3)}
.bar-h{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--s3);margin:6px 0}
.bar-h span{display:block;height:100%}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);height:100vh;height:100dvh;overflow:hidden}
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
button{cursor:pointer;font-family:var(--fb);border:none;background:none;color:var(--tx)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{font-family:var(--fb);color:var(--tx);background:var(--s3);border:1px solid var(--bd);border-radius:var(--r);padding:9px 12px;font-size:13px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac)}
table{border-collapse:collapse;width:100%}
.hidden{display:none!important}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.ld-logo{font-family:var(--fn);font-size:clamp(54px,12vw,100px);font-weight:900;letter-spacing:.18em;background:linear-gradient(135deg,var(--ac),var(--bl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ld-sub{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
/* SIDEBAR */
.sb{width:200px;flex-shrink:0;background:linear-gradient(180deg,#0a1320,#080f1a);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .25s ease;z-index:40}
.sb-head{height:var(--tbh);padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.sb-logo{font-family:var(--fn);font-size:15px;font-weight:900;letter-spacing:.18em;color:var(--ac)}
.sb-club{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd)}
.sb-badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fn);font-weight:900;font-size:15px;color:#fff;background:#1982c4;flex-shrink:0}
.sb-cname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-div{font-size:10px;color:var(--dim)}
.sb-nav{flex:1;overflow-y:auto;padding:4px 0}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:10px 14px;font-size:13px;color:var(--dim);border-left:2px solid transparent;text-align:left}
.nv:hover{background:rgba(255,255,255,.04);color:var(--tx)}.nv.act{background:rgba(0,229,204,.08);color:var(--ac);border-left-color:var(--ac);font-weight:600}
.nv-icon{font-size:15px;width:18px;text-align:center}
.nv .cnt{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px}
.sb-bottom{padding:9px 12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sb-stat{font-family:var(--fm);font-size:10px;color:var(--dim)}
/* MAIN */
.mc{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.tb{height:var(--tbh);padding:0 14px;background:rgba(8,12,20,.97);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-mob{display:none;font-size:20px;padding:4px 8px}
.tb-stats{display:flex;gap:14px;flex:1;overflow:hidden;min-width:0}
.tbi{display:flex;flex-direction:column;flex-shrink:0}
.tbl{font-family:var(--fm);font-size:8px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.tbv{font-family:var(--fm);font-size:12px;font-weight:700;white-space:nowrap}
.up{color:var(--gr)}.dn{color:var(--rd)}
.win-pill{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.win-open{background:rgba(0,230,118,.15);border:1px solid rgba(0,230,118,.5);color:var(--gr);animation:pulse 2s infinite}
.win-closed{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.3);color:#ff8a8a}
@keyframes pulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px rgba(0,230,118,.18)}}
#sc{flex:1;overflow-y:auto;padding:16px 16px 96px}
/* CONTINUE: fixed bottom-right on desktop, bottom bar on phones. Notifications never go here. */
#continueBtn{position:fixed;right:18px;bottom:18px;z-index:60;max-width:min(360px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#bottomBar{display:contents}
#bottomBar .bb{display:none}
#notif{position:fixed;top:calc(var(--tbh) + 8px);right:14px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:min(340px,92vw)}
.nf{background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:9px 13px;font-size:12px;opacity:0;transform:translateY(-8px);transition:all .25s;box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:auto}
.nf.ns{opacity:1;transform:none}
.nfi{border-left:3px solid var(--bl)}.nfw{border-left:3px solid var(--or)}.nfd{border-left:3px solid var(--rd)}.nfg{border-left:3px solid var(--gr)}
/* CARDS */
.card{background:linear-gradient(135deg,#0d1520,#111d2e);border:1px solid var(--bd);border-radius:var(--rl);padding:14px;margin-bottom:12px}
.ch{font-family:var(--fn);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sct{font-family:var(--fn);font-size:22px;font-weight:700;margin-bottom:13px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.scs{font-size:12px;color:var(--dim);font-weight:400}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g2>*,.g4>*{min-width:0}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.bp{background:linear-gradient(135deg,#007a45,#00a854);color:#fff;border-color:#00c870}
.bs{background:var(--s3);border-color:var(--bd2)}.bs:hover{border-color:var(--ac)}
.bg{background:transparent;color:var(--dim);border-color:var(--bd)}.bg:hover{background:var(--s3);color:var(--tx)}
.br{background:rgba(255,82,82,.12);color:var(--rd);border-color:rgba(255,82,82,.3)}
.bo{background:rgba(255,171,64,.12);color:var(--or);border-color:rgba(255,171,64,.3)}
.bac{background:linear-gradient(135deg,#005a50,#007a6a);color:#fff;border-color:var(--ac)}
.bm{background:linear-gradient(135deg,#003d7a,#0057b3);color:#fff;border-color:var(--bl);font-family:var(--fn);font-size:16px;letter-spacing:.06em;padding:12px 22px}
.bsm{padding:5px 11px;font-size:11px;border-radius:6px}
.bxs{padding:3px 8px;font-size:10px;border-radius:5px}
.bact{background:rgba(0,229,204,.15)!important;color:var(--ac)!important;border-color:var(--ac)!important}
.fw{width:100%}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.tg{background:rgba(0,230,118,.12);color:var(--gr)}.tr{background:rgba(255,82,82,.12);color:var(--rd)}.to{background:rgba(255,171,64,.12);color:var(--or)}.tb2{background:rgba(77,166,255,.12);color:var(--bl)}.ta{background:rgba(0,229,204,.12);color:var(--ac)}.tgold{background:rgba(255,215,0,.12);color:var(--gold)}
.st thead th{background:rgba(255,255,255,.03);padding:7px 8px;text-align:left;font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--bd);white-space:nowrap}
.st th.tc,.st td.tc{text-align:center}
.st tbody tr{border-bottom:1px solid rgba(255,255,255,.04)}.st tbody tr:hover{background:rgba(255,255,255,.03)}
.st tbody td{padding:7px 8px;font-size:12px}
.hlr{background:rgba(0,229,204,.07)!important}
.sr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;gap:10px}
.sr:last-child{border-bottom:none}
.kpi{background:linear-gradient(135deg,#0d1520,#111d2e);border:1px solid var(--bd);border-radius:var(--rl);padding:12px;text-align:center}
.kpi-v{font-family:var(--fn);font-size:23px;font-weight:700;line-height:1;margin-bottom:3px}
.kpi-l{font-family:var(--fm);font-size:8px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.kpi-s{font-size:10px;color:var(--dim);margin-top:3px}
.rb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:5px;font-family:var(--fm);font-size:11px;font-weight:700;background:var(--s3);border:1px solid var(--bd2)}
.rb-e{border-color:rgba(255,215,64,.5);color:var(--yw)}.rb-h{border-color:rgba(0,230,118,.4);color:var(--gr)}
/* rating tiers: one colour scale everywhere */
.rb.q1{background:#3b4656;border-color:#4b5a6e;color:#d5dde8}.rb.q2{background:#b3541e;border-color:#d06a2c;color:#fff}.rb.q3{background:#c79a12;border-color:#e0b52a;color:#1a1400}
.rb.q4{background:#2e9e4f;border-color:#46bd68;color:#fff}.rb.q5{background:#0fa3a3;border-color:#2ec4c4;color:#fff}.rb.q6{background:linear-gradient(135deg,#ffe066,#f5b301);border-color:#ffe98a;color:#231a00}
.rb.big{min-width:50px;height:42px;font-size:20px;border-radius:10px}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}.stars .dim{color:var(--mut)}

<body>
<div id="loading"><div class="ld-logo">THE GAFFER</div><div class="ld-sub" id="ldSub">Connecting…</div></div>
<div id="notif"></div>

<div class="welcome hidden" id="welcomeScreen">
  <div class="wc">
    <div class="wtitle">THE<br>GAFFER</div>
    <p class="wsub">Start at the bottom. Climb every division. Reach the top.</p>
    <div class="row" style="justify-content:center">
      <button class="btn bp bm" onclick="showSetup()">⚽ New Career</button>
      <button class="btn bs bm" onclick="loadSlot('auto', true)">▶ Continue</button>
    </div>
    <button class="btn bac bm hidden" data-install onclick="installApp()" style="margin-top:14px">📲 Install the app</button>
  </div>
</div>

<div class="mo hidden" id="setupMo">
  <div class="mbox">
    <div class="mo-title">🏟 New Career</div>
    <p class="small dim" style="margin-bottom:12px">Every career starts at a poor club in the lowest division of the nation you pick.</p>
    <div style="display:flex;flex-direction:column;gap:11px">
      <div><label class="lbl">Country</label><select id="setupCountry" onchange="loadSetupClubs()"></select></div>
      <div><label class="lbl">Club mode</label><select id="setupMode" onchange="toggleSetupMode()"><option value="existing">Choose a lowest-division club</option><option value="create">Create your own club</option></select></div>
      <div id="setupExisting"><label class="lbl" id="setupClubLabel">Club</label><select id="setupClub"></select></div>
      <div id="setupCreate" class="hidden"><label class="lbl">Club name</label><input id="setupClubName" type="text" placeholder="My FC" maxlength="30"></div>
      <div><label class="lbl">Challenge code (optional)</label><input id="setupCode" type="text" placeholder="GAF-XXXXX-00 — play a friend's exact world" maxlength="24"></div>
      <button class="btn bac fw mt4 bm" onclick="startCareer()">START CAREER</button>
      <button class="btn bg fw" onclick="closeMo('setupMo')">Cancel</button>
    </div>
  </div>
</div>

<div class="mo hidden" id="genMo"><div class="mbox" id="genMoContent"></div></div>
<div class="mo hidden" id="pickMo" style="z-index:120" onclick="if(event.target===this)closePicker()"><div class="mbox" id="pickMoContent"></div></div>

<div id="app" class="hidden">
  <div class="sb-ov" id="sbOv" onclick="closeSb()"></div>
  <aside class="sb" id="sb">
    <div class="sb-head"><span class="sb-logo">THE GAFFER</span></div>
    <div class="sb-club"><div class="sb-badge" id="sbBadge">?</div><div style="min-width:0"><div class="sb-cname" id="sbName">–</div><div class="sb-div" id="sbLeague">–</div></div></div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-bottom">
      <div class="sb-stat" id="sbWeek">–</div>
      <button class="btn bac bsm fw hidden" data-install onclick="installApp()">📲 Install app</button>
      <button class="btn bg bsm fw" onclick="saveToSlot('slot_1')">💾 Quick save (slot 1)</button>
      <button class="btn bg bsm fw" onclick="exitGame()">🚪 Main menu</button>
    </div>
  </aside>
  <div class="mc">
    <div class="tb">
      <button class="tb-back hidden" id="tbBack" onclick="goBack()" aria-label="Back">‹ Back</button>
      <button class="tb-mob" onclick="openSb()" aria-label="Menu">☰</button>
      <div class="tb-stats" id="tbStats"></div>
      <div id="winPill"></div>
    </div>
    <div id="sc"></div>
  </div>
</div>

<div id="bottomBar" class="hidden">
  <button class="bb" onclick="navTo('dash')"><span>🏠</span>Home</button>
  <button class="bb" onclick="navTo('squad')"><span>👥</span>Squad</button>
  <button class="btn bm" id="continueBtn" onclick="advance()">Continue</button>
  <button class="bb" onclick="navTo('transfers')"><span>💰</span>Market</button>
  <button class="bb" onclick="openSb()"><span>☰</span>More</button>
</div>

<script>
const BASE = window.location.origin;
let STATE = null, SETUP = null, currentSection = 'dash', busy = false, weekEvents = [];
const NAV = [
  ['dash','🏠','Home'],['inbox','📥','Inbox'],['news','📰','News'],['squad','👥','Squad'],['dressing','🗣','Dressing Room'],['lineup','📋','Lineup'],['tactics','🎯','Tactics'],
  ['fixtures','📅','Fixtures'],['continental','🏆','Continental'],['cup','🎟','Cups'],['international','🌐','International'],
  ['transfers','💰','Transfers'],['scouting','🔭','Scouting'],['academy','🎓','Academy'],
  ['finances','📊','Finances'],['staff','👔','Staff'],['career','💼','Career & Board'],
  ['club2','🏢','Second Club'],['performance','📈','Stats'],['awards','🏅','Awards & Records'],['challenges','🏁','Challenges'],['leagues','🌍','Leagues'],
  ['history','📚','History'],['saves','💾','Saves'],['settings','⚙️','Settings']
];
// Preferences live in this browser only (theme, text size, match view mode and speed).
const PREFS = (() => { try { return JSON.parse(localStorage.getItem('gaffer_prefs') || '{}'); } catch { return {}; } })();
function savePrefs(){ try { localStorage.setItem('gaffer_prefs', JSON.stringify(PREFS)); } catch {} }
function applyPrefs(){ document.documentElement.dataset.theme = PREFS.theme || 'dark'; document.documentElement.dataset.size = PREFS.size || 'normal'; }
applyPrefs();

// ── helpers ─────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){ if(n==null) return '0'; const a=Math.abs(n); const s=n<0?'-':''; if(a>=1e9) return s+(a/1e9).toFixed(1)+'B'; if(a>=1e6) return s+(a/1e6).toFixed(2)+'M'; if(a>=1e3) return s+(a/1e3).toFixed(0)+'K'; return s+Math.round(a); }
const money = n => (n<0?'-$':'$')+fmt(Math.abs(n));
function tier(v){ return v >= 80 ? 'q6' : v >= 70 ? 'q5' : v >= 60 ? 'q4' : v >= 50 ? 'q3' : v >= 40 ? 'q2' : 'q1'; }
function rb(v){ return `<span class="rb ${v == null ? '' : tier(v)}">${v ?? '–'}</span>`; }
function stars(pot){ if (pot == null) return '<span class="dim">?</span>'; const n = Math.max(1, Math.min(5, Math.round((pot - 28) / 12))); return '★'.repeat(n) + `<span class="dim">${'★'.repeat(5 - n)}</span>`; }
function potLabel(p){ return p>=85?'<span class="tag tgold">Elite</span>':p>=75?'<span class="tag tg">V.High</span>':p>=65?'<span class="tag tb2">High</span>':'<span class="tag dim">Good</span>'; }
function attrBar(v,w=48){ const c=v>=75?'var(--gr)':v>=55?'var(--bl)':v>=40?'var(--or)':'var(--rd)'; return `<span class="attr-bar" style="width:${w}px"><span class="attr-fill" style="display:block;width:${v}%;background:${c}"></span></span>`; }
const fitColor = f => f>=85?'var(--gr)':f>=70?'var(--or)':'var(--rd)';
const findPlayer = id => [...(STATE.squad||[]),...(STATE.youth||[]),...(STATE.market||[])].find(p => p.id === id);
const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');

// Two engines, one API: the server, or the same game running offline in a Web Worker
// (engine.worker.js, saves in this browser). Offline starts automatically when no server answers.
let MODE = 'server', WORKER = null, REQ = 0;
const PENDING = new Map();
function startWorker(){
  if (WORKER) return true;
  if (typeof Worker === 'undefined') return false;
  WORKER = new Worker('engine.worker.js');
  WORKER.onmessage = e => { const { id, payload } = e.data || {}; const cb = PENDING.get(id); if (cb) { PENDING.delete(id); cb(payload); } };
  WORKER.onerror = e => notify('Offline engine error: ' + (e.message || 'unknown'), 'd');
  return true;
}
async function api(path, options = {}) {
  if (MODE === 'offline') {
    if (!startWorker()) return { ok: false, error: 'This browser cannot run the offline engine' };
    return new Promise(resolve => { const id = ++REQ; PENDING.set(id, resolve); WORKER.postMessage({ id, method: options.method || 'GET', path, body: options.body ? JSON.parse(options.body) : {} }); });
  }
  try {
    const r = await fetch(BASE + path, { headers: { 'Content-Type': 'application/json' }, ...options });
    return await r.json();
  } catch (e) { notify('Server unreachable: ' + e.message + '. Settings → Play offline keeps you going.', 'd'); return { ok: false, error: e.message }; }
}
async function serverAlive(){
  if (!/^https?:/.test(location.protocol)) return false;
  // Static hosts (GitHub Pages, Netlify, Vercel, Cloudflare Pages) never run the game server.
  if (/(\.github\.io|\.netlify\.app|\.vercel\.app|\.pages\.dev)$/i.test(location.hostname)) return false;
  try {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 3500);
    const r = await fetch(BASE + '/api/health', ctl ? { signal: ctl.signal } : {});
    clearTimeout(t);
    const j = await r.json();
    return !!(j && j.ok && !j.public);   // a public host serves the app only: play in this browser
  } catch { return false; }
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });
function applyCurrent(r){ if (r && r.current) STATE = r.current; else if (r && r.hasCareer) STATE = r; }

// ── boot ────────────────────────────────────────────────────────────
async function boot() {
  setLd('Loading…');
  if (PREFS.mode === 'offline' || !(await serverAlive())) {
    if (startWorker()) { MODE = 'offline'; setLd('Starting the offline engine…'); }
  }
  const setup = await api('/api/setup');
  if (!setup.ok) { setLd('Cannot reach the server or start the offline engine.'); return; }
  SETUP = setup;
  const state = await api('/api/state');
  document.getElementById('loading').classList.add('hidden');
  if (state.ok && state.hasCareer) { STATE = state; showMain(); }
  else document.getElementById('welcomeScreen').classList.remove('hidden');
}
function setLd(msg){ document.getElementById('ldSub').textContent = msg; }

function showSetup(){
  const sel = document.getElementById('setupCountry');
  sel.innerHTML = SETUP.countries.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  sel.value = SETUP.defaultCountry || 'Nigeria';
  loadSetupClubs(); openMo('setupMo');
}
function loadSetupClubs(){
  const country = document.getElementById('setupCountry').value;
  document.getElementById('setupClubLabel').textContent = `Club — ${SETUP.leagueByCountry[country] || 'lowest division'}`;
  document.getElementById('setupClub').innerHTML = (SETUP.clubsByCountry[country] || []).map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
}
function toggleSetupMode(){
  const mode = document.getElementById('setupMode').value;
  document.getElementById('setupExisting').classList.toggle('hidden', mode !== 'existing');
  document.getElementById('setupCreate').classList.toggle('hidden', mode !== 'create');
}
async function startCareer(){
  const mode = document.getElementById('setupMode').value;
  const body = { country: document.getElementById('setupCountry').value, mode, clubName: document.getElementById('setupClub').value, customClubName: document.getElementById('setupClubName').value.trim() };
  const code = (document.getElementById('setupCode').value || '').trim();
  if (code) { body.challenge = code; if (!body.customClubName) body.customClubName = 'Challenge FC'; }
  else if (mode === 'create' && !body.customClubName) return notify('Enter a club name', 'w');
  const r = await post('/api/reset', body);

function pickTalk(btn){
  document.querySelectorAll('#htTalk button').forEach(b => b.classList.toggle('bact', b === btn && !b.classList.contains('bact')));
  document.getElementById('htTalkHint').textContent = btn.title;
}
async function resumeMatch(withChanges){
  const body = {};
  const talkBtn = document.querySelector('#htTalk .bact');
  if (talkBtn) body.talk = talkBtn.dataset.talk;
  if (withChanges) {
    body.tactic = document.getElementById('htTactic').value;
    body.formation = document.getElementById('htFormation').value;
    body.instructions = Object.fromEntries(INSTR_UI.map(([key]) => [key, (document.getElementById('ht_' + key) || {}).value || 'normal']));
    body.subs = HT.subs.slice();
  }
  closeMo('genMo');
  busy = true; updateTopbar();
  const r = await post('/api/match/resume', body);
  busy = false;
  if (!r.ok) { updateTopbar(); return notify(r.error || 'Could not resume', 'd'); }
  applyCurrent(r); refresh();
  const finished = r.halftime ? r.finished : (r.out && r.out.reports && r.out.reports.length ? r.out.reports[r.out.reports.length - 1] : null);
  const next = () => { if (r.halftime) playHalf(r.halftime, 0, 45, () => showHalftime(r.halftime)); else afterWeek(r.out, true); };
  if (!finished) return next();
  const end = finished.events.some(e => e.min > 90) ? 120 : 90;
  playHalf(finished, 45, end, () => showFullTime(finished, next));
}

function statusTag(p){

  if (p.suspension > 0) return `<span class="tag tr">BANNED ${p.suspension}</span>`;
  if (p.loan) return '<span class="tag tb2">LOAN</span>';
  if (p.listedForSale) return '<span class="tag to">LISTED</span>';

}
const POS_ORDER = ['GK', 'CB', 'LB', 'RB', 'CDM', 'CM', 'CAM', 'LW', 'RW', 'ST', 'CF'];
const POS_GROUP = { GK: 'Goalkeepers', CB: 'Defenders', LB: 'Defenders', RB: 'Defenders', CDM: 'Midfielders', CM: 'Midfielders', CAM: 'Midfielders', LW: 'Attackers', RW: 'Attackers', ST: 'Attackers', CF: 'Attackers' };
const GROUP_CLS = { Goalkeepers: 'pg', Defenders: 'pd', Midfielders: 'pm', Attackers: 'pa' };
const SQ_SORTS = [['pos', 'Position'], ['ovr', 'Rating'], ['pot', 'Potential'], ['value', 'Value'], ['age', 'Age'], ['wage', 'Wage'], ['form', 'Form'], ['goals', 'Goals'], ['fit', 'Condition']];
let SQ_SORT = 'pos';
function posPill(pos){ return `<span class="pos ${GROUP_CLS[POS_GROUP[pos]] || 'pm'}">${esc(pos)}</span>`; }
function progressTag(p){ return p.progress > 0 ? `<span class="up-a" title="Improved this season">▲${p.progress}</span>` : p.progress < 0 ? `<span class="dn-a" title="Declined this season">▼${-p.progress}</span>` : ''; }
function squadSorted(list){
  const f = { pos: (a, b) => POS_ORDER.indexOf(a.position) - POS_ORDER.indexOf(b.position) || b.ovr - a.ovr, ovr: (a, b) => b.ovr - a.ovr, pot: (a, b) => b.pot - a.pot || b.ovr - a.ovr,
    value: (a, b) => b.marketValue - a.marketValue, age: (a, b) => a.age - b.age || b.ovr - a.ovr, wage: (a, b) => b.weeklyWage - a.weeklyWage, form: (a, b) => (b.form || 0) - (a.form || 0) || b.ovr - a.ovr,
    goals: (a, b) => b.seasonStats.goals - a.seasonStats.goals || b.seasonStats.assists - a.seasonStats.assists, fit: (a, b) => b.fit - a.fit }[SQ_SORT] || ((a, b) => b.ovr - a.ovr);
  return list.slice().sort(f);
}

// ── Lineup: tap a player, compare him with the alternatives, choose ──
// The rating shown for a slot is the same sum the match engine uses: the mean of that position's
// four key attributes, minus a penalty when it is not the player's natural position.
const LU_ATTRS = { GK: ['strength', 'vision', 'workRate', 'defending'], CB: ['defending', 'strength', 'workRate', 'pace'], LB: ['pace', 'defending', 'passing', 'workRate'], RB: ['pace', 'defending', 'passing', 'workRate'],
  CDM: ['defending', 'workRate', 'passing', 'strength'], CM: ['passing', 'vision', 'workRate', 'dribbling'], CAM: ['vision', 'passing', 'dribbling', 'finishing'], LW: ['pace', 'dribbling', 'finishing', 'vision'],
  RW: ['pace', 'dribbling', 'finishing', 'vision'], ST: ['finishing', 'pace', 'strength', 'vision'], CF: ['finishing', 'vision', 'dribbling', 'pace'] };
const LU_COMPAT = { GK: ['GK'], CB: ['CB', 'CDM'], LB: ['LB', 'CB', 'LW'], RB: ['RB', 'CB', 'RW'], CDM: ['CDM', 'CM', 'CB'], CM: ['CM', 'CDM', 'CAM'], CAM: ['CAM', 'CM', 'LW', 'RW'], LW: ['LW', 'CAM', 'LB', 'RW'], RW: ['RW', 'CAM', 'RB', 'LW'], ST: ['ST', 'CF', 'LW', 'RW'], CF: ['CF', 'ST', 'CAM'] };
const LU_LABEL = { pace: 'Pace', finishing: 'Finishing', passing: 'Passing', dribbling: 'Dribbling', defending: 'Defending', strength: 'Strength', vision: 'Vision', workRate: 'Work rate' };
const POS_NAME = { GK: 'goalkeeper', CB: 'centre-back', LB: 'left-back', RB: 'right-back', CDM: 'defensive midfielder', CM: 'central midfielder', CAM: 'attacking midfielder', LW: 'left winger', RW: 'right winger', ST: 'striker', CF: 'centre-forward' };
function slotRating(p, slot){
  const keys = LU_ATTRS[slot] || Object.keys(LU_LABEL), a = p.attrs || {};
  let t = 0, n = 0;
  for (const k of keys) if (a[k] != null) { t += a[k]; n++; }
  let pen = 0;
  if (p.position !== slot) pen = slot === 'GK' || p.position === 'GK' ? 30 : (LU_COMPAT[slot] || []).includes(p.position) ? 4 : 12;
  return Math.max(1, Math.min(99, Math.round(t / Math.max(n, 1)) - pen));
}
function slotFit(p, slot){
  if (!slot || p.position === slot) return ['Natural position', 'var(--gr)'];
  if (slot === 'GK' || p.position === 'GK') return ['Wrong position (−30)', 'var(--rd)'];
  return (LU_COMPAT[slot] || []).includes(p.position) ? ['Can play here (−4)', 'var(--or)'] : ['Out of position (−12)', 'var(--rd)'];
}
const sqById = id => (STATE.squad || []).find(p => p.id === id);
const notFit = p => (p.injured ? 'Injured' : p.suspension ? `Suspended (${p.suspension} match${p.suspension > 1 ? 'es' : ''})` : '');

  const lines = [[], [], [], [], [], []];
  xi.forEach(s => lines[rowsOf[s.slot] ?? 3].push(s));
  const filled = xi.filter(s => s.playerId), avg = a => (a.length ? Math.round(a.reduce((t, v) => t + v, 0) / a.length) : 0);
  const tile = (s, _i, l) => {

      <div class="sl">${esc(s.slot)}${manual.has(s.slotKey) ? ' · yours' : ''}</div><div class="nm" title="${esc(s.playerName || '')}">${esc(s.playerName ? (l.length > 3 ? s.playerName.split(' ').slice(1).join(' ') || s.playerName : s.playerName) : 'Empty')}</div>
      ${p ? `<div class="pmeta">${rb(s.slotRating)}<span style="color:${fitColor(s.fit)}">${s.fit}%</span>${p.form != null ? rb10(p.form) : ''}</div>${p.position !== s.slot ? `<div class="small" style="color:var(--or)">plays ${esc(p.position)}</div>` : ''}` : '<div class="small dim">tap to pick</div>'}

    return `<div class="lu-row" onclick="openPicker('bench','${i}')">${posPill(p.position)}${rb(p.ovr)}<span class="lu-n"><b>${esc(p.name)}</b><span class="small dim">${p.age} yrs · form ${p.form != null ? Number(p.form).toFixed(1) : '–'} · ${p.seasonStats.goals}G ${p.seasonStats.assists}A</span></span><span style="color:${fitColor(p.fit)};font-family:var(--fm);font-size:12px">${p.fit}%</span><span class="lu-act">Change ›</span></div>`;

      <div class="lu-sum"><span>Team rating <b>${avg(filled.map(s => s.slotRating))}</b></span><span>Average condition <b style="color:${fitColor(avg(filled.map(s => s.fit)))}">${avg(filled.map(s => s.fit))}%</b></span><span>${manual.size} of ${xi.length} picked by you</span></div>
      <div class="small dim mt8">On each player: his rating in that position, his condition and his recent form. A teal border is your pick; the rest are chosen by your assistant, who rotates only for condition (under 75%), injury or a clearly better option.</div>
      ${(STATE.selectionChanges || []).length ? `<div class="card mt8" style="padding:9px"><div class="ch">Assistant's changes this week</div>${STATE.selectionChanges.map(c => `<div class="small">${esc(c.outName || '—')} → ${esc(c.inName || '—')} <span class="dim">(${esc(c.reason)})</span></div>`).join('')}</div>` : ''}
      <div class="row mt12"><button class="btn br bsm" onclick="clearLineup()">Reset everything to the assistant</button></div>

      <div class="card" style="padding:0;overflow:hidden"><div class="ch" style="padding:12px 12px 4px">Bench <span class="small dim">${bench.length} of 7 · tap to change</span></div>${Array.from({ length: 7 }, (_, i) => seat(i)).join('')}</div>
      <div class="card" style="padding:0;overflow:hidden"><div class="ch" style="padding:12px 12px 4px">Not in the matchday squad <span class="small dim">${rest.length}</span></div>
        ${rest.length ? rest.map(p => `<div class="lu-row" onclick="showPlayer(${p.id})">${posPill(p.position)}${rb(p.ovr)}<span class="lu-n"><b>${esc(p.name)}</b><span class="small dim">${p.age} yrs · form ${p.form != null ? Number(p.form).toFixed(1) : '–'}${notFit(p) ? ` · <span style="color:var(--rd)">${notFit(p)}</span>` : ''}</span></span><span style="color:${fitColor(p.fit)};font-family:var(--fm);font-size:12px">${p.fit}%</span></div>`).join('') : '<div class="small dim" style="padding:12px">Everyone is involved.</div>'}
      </div>
    </div>
  </div>`;
}

// The chooser: the player you would replace is pinned on top; every alternative shows his rating
// in this position, the difference, condition, morale, form, season output and the key attributes.
let PICK = null, HT = { h: null, subs: [] };
function openPicker(kind, key){ PICK = { kind, key: String(key), sort: 'rating' }; renderPicker(); openMo('pickMo'); }
function closePicker(){ PICK = null; closeMo('pickMo'); }
function pickerData(){
  const k = PICK.kind, xi = STATE.currentXI || [], bench = STATE.bench || [];
  if (k === 'xi') {
    const s = xi.find(x => x.slotKey === PICK.key), cur = s && s.playerId ? sqById(s.playerId) : null;
    const at = new Map(xi.filter(x => x.playerId).map(x => [x.playerId, x.slot])), onBench = new Set(bench.map(b => b.playerId));
    const cands = (STATE.squad || []).filter(p => !cur || p.id !== cur.id).map(p => ({ p, r: slotRating(p, s.slot), out: notFit(p), where: at.has(p.id) ? `Starting at ${at.get(p.id)} — the two swap places` : onBench.has(p.id) ? 'On the bench' : 'Not in the matchday squad' }));
    return { title: `Choose your ${POS_NAME[s.slot] || s.slot}`, slot: s.slot, cur, curR: cur ? slotRating(cur, s.slot) : null, cands, canAuto: (STATE.manualXI || []).some(m => m.slotKey === PICK.key) };
  }
  if (k === 'bench') {
    const i = +PICK.key, b = bench[i], cur = b ? sqById(b.playerId) : null;
    const starting = new Set(xi.map(x => x.playerId)), onBench = new Set(bench.map(x => x.playerId));
    const cands = (STATE.squad || []).filter(p => !starting.has(p.id) && (!cur || p.id !== cur.id)).map(p => ({ p, r: p.ovr, out: notFit(p), where: onBench.has(p.id) ? 'Already on the bench — the two swap seats' : 'Not in the matchday squad' }));
    return { title: `Bench seat ${i + 1}`, slot: null, cur, curR: cur ? cur.ovr : null, cands, note: 'Starters are not listed here. A good bench covers every line: a goalkeeper, defenders, midfielders and attackers.' };
  }
  const h = HT.h, on = h.onPitch.find(x => String(x.playerId) === PICK.key);
  const blank = x => ({ id: x.playerId, name: x.name, position: x.position, ovr: x.ovr, attrs: {}, seasonStats: {} });
  const cur = { ...(sqById(on.playerId) || blank(on)), fit: on.fit };
  const used = new Set(HT.subs.map(s => s.onId));
  const cands = h.bench.filter(b => !used.has(b.playerId)).map(b => { const p = { ...(sqById(b.playerId) || blank(b)), fit: b.fit }; return { p, r: slotRating(p, on.slot), out: b.injured ? 'Injured' : '', where: 'On the bench' }; });
  return { title: `Replace ${on.name}`, slot: on.slot, cur, curR: slotRating(cur, on.slot), cands, note: `He is playing as your ${POS_NAME[on.slot] || on.slot}. Condition is as it stands at half-time.` };
}
function pickVerdict(c, cur, curR){
  if (c.out) return [c.out, 'var(--rd)'];
  if (!cur) return ['Fills the gap', 'var(--gr)'];
  const d = c.r - curR, tired = c.p.fit < 75, fresher = c.p.fit - cur.fit >= 12;
  if (d >= 3) return tired ? [`Better (+${d}) but tired`, 'var(--or)'] : [`Better choice (+${d})`, 'var(--gr)'];
  if (d <= -3) return fresher && cur.fit < 75 ? [`Weaker (${d}) but much fresher`, 'var(--or)'] : [`Weaker (${d})`, 'var(--rd)'];
  return fresher ? ['About the same, and fresher', 'var(--gr)'] : tired && cur.fit >= 75 ? ['About the same, but tired', 'var(--or)'] : ['About the same', 'var(--dim)'];
}
function pickCard(c, d, isCur){
  const p = c.p, slot = d.slot, ss = p.seasonStats || {}, cur = isCur ? null : d.cur;
  const [fitTxt, fitCol] = slotFit(p, slot);
  const diff = !isCur && d.cur ? c.r - d.curR : null;
  const attrs = (LU_ATTRS[slot || p.position] || []).map(k => {
    const v = (p.attrs || {})[k], o = cur && cur.attrs ? cur.attrs[k] : null;
    const col = v == null || o == null || Math.abs(v - o) < 2 ? 'var(--tx)' : v > o ? 'var(--gr)' : 'var(--rd)';
    return `<span><i>${LU_LABEL[k]}</i><b style="color:${col}">${v ?? '–'}${v != null && o != null && Math.abs(v - o) >= 2 ? (v > o ? ' ▲' : ' ▼') : ''}</b></span>`;
  }).join('');
  const [vt, vc] = isCur ? ['', ''] : pickVerdict(c, d.cur, d.curR);
  return `<div class="pk ${isCur ? 'pk-cur' : ''} ${c.out ? 'pk-out' : ''}" ${isCur || c.out ? '' : `onclick="choosePick(${p.id})"`}>
    <div class="pk-top">${playerPortrait(p, 42)}${posPill(p.position)}<div class="pk-n"><b>${esc(p.name)}</b><div class="small" style="color:${fitCol}">${p.age != null ? `<span class="dim">${p.age} yrs · </span>` : ''}${fitTxt}</div></div>
      <div class="pk-r"><span class="rb big ${tier(c.r)}">${c.r}</span>${diff != null ? `<span class="pk-d" style="color:${diff > 0 ? 'var(--gr)' : diff < 0 ? 'var(--rd)' : 'var(--dim)'}">${diff > 0 ? '+' + diff : diff === 0 ? '=' : diff}</span>` : ''}</div></div>
    <div class="pk-stats"><span><i>Condition</i><b style="color:${fitColor(p.fit)}">${p.fit}%</b></span><span><i>Morale</i><b style="color:${p.mor >= 65 ? 'var(--gr)' : p.mor >= 45 ? 'var(--or)' : 'var(--rd)'}">${p.mor ?? '–'}</b></span><span><i>Form</i>${p.form != null ? rb10(p.form) : '<b class="dim">–</b>'}</span><span><i>Season</i><b>${ss.goals || 0}G ${ss.assists || 0}A</b></span><span><i>Games</i><b>${ss.apps || 0}</b></span></div>
    <div class="pk-stats pk-attrs">${attrs}</div>
    ${isCur ? '' : `<div class="pk-foot"><b style="color:${vc}">${vt}</b><span class="small dim">${esc(c.where)}</span>${c.out ? '' : '<span class="pk-go">Choose ›</span>'}</div>`}
  </div>`;
}
function renderPicker(){
  if (!PICK) return;
  const d = pickerData();
  const by = { rating: (a, b) => b.r - a.r || b.p.fit - a.p.fit, fit: (a, b) => b.p.fit - a.p.fit || b.r - a.r, form: (a, b) => (b.p.form || 0) - (a.p.form || 0) || b.r - a.r }[PICK.sort];
  const cands = d.cands.slice().sort((a, b) => (a.out ? 1 : 0) - (b.out ? 1 : 0) || by(a, b));

async function sendLineup(manual, bench, msg){
  const r = await post('/api/lineup', { lineup: [...manual].map(([slotKey, playerId]) => ({ slotKey, playerId })), ...(bench ? { bench } : {}) });
  applyCurrent(r); notify(r.ok ? msg : r.error, r.ok ? 'g' : 'd'); refresh();
}
async function choosePick(id){
  const k = PICK.kind, key = PICK.key;
  if (k === 'sub') { HT.subs = HT.subs.filter(s => s.offId !== +key); HT.subs.push({ offId: +key, onId: id }); closePicker(); renderHtSubs(); return; }
  const xi = STATE.currentXI || [];
  const manual = new Map((STATE.manualXI || []).map(m => [m.slotKey, m.playerId]));
  let bench = STATE.manualBench ? (STATE.bench || []).map(b => b.playerId) : null;
  if (k === 'xi') {
    const here = xi.find(s => s.slotKey === key), there = xi.find(s => s.playerId === id);
    for (const [sk, pid] of manual) if (pid === id) manual.delete(sk);
    manual.set(key, id);
    if (there && there.slotKey !== key) { if (here.playerId) manual.set(there.slotKey, here.playerId); else manual.delete(there.slotKey); }
    else if (bench && here.playerId) bench = bench.map(b => (b === id ? here.playerId : b));
  } else {
    bench = (STATE.bench || []).map(b => b.playerId);
    const i = Math.min(+key, bench.length), j = bench.indexOf(id);
    if (j >= 0) bench[j] = bench[i];
    bench[i] = id; bench = bench.filter(x => x != null);
  }
  closePicker();
  await sendLineup(manual, bench, 'Lineup updated');
}
async function autoSlot(){
  const manual = new Map((STATE.manualXI || []).map(m => [m.slotKey, m.playerId]));
  manual.delete(PICK.key); closePicker();
  await sendLineup(manual, null, 'The assistant picks that position again');
}

function renderHtSubs(){
  const el = document.getElementById('htSubs'), h = HT.h; if (!el || !h) return;
  const left = h.maxSubs - h.subsUsed - HT.subs.length;
  el.innerHTML = `<div class="ch">Your players <span class="small dim">tap one to take him off · ${Math.max(0, left)} change${left === 1 ? '' : 's'} left</span></div>` + h.onPitch.map(p => {
    const sub = HT.subs.find(s => s.offId === p.playerId), on = sub && h.bench.find(b => b.playerId === sub.onId);
    const act = sub ? `cancelSub(${p.playerId})` : left > 0 ? `openPicker('sub','${p.playerId}')` : `notify('No substitutions left', 'w')`;
    return `<div class="lu-row ${sub ? 'lu-sub' : ''}" onclick="${act}"><span class="pos pm" style="background:var(--s3);color:var(--ac)">${esc(p.slot)}</span>${rb(p.rating)}<span class="lu-n">${sub ? `<span><s class="dim">${esc(p.name)}</s> → <b>${esc(on ? on.name : '')}</b></span>` : `<b>${esc(p.name)}</b>`}</span><span style="color:${fitColor(p.fit)};font-family:var(--fm);font-size:12px">${p.fit}%</span><span class="lu-act">${sub ? '✕ Undo' : 'Sub ›'}</span></div>`;

  });

async function saveToSlot(slot){ const r = await post(`/api/saves/${slot}`); notify(r.ok ? `Saved to ${slot.replace('_', ' ')}` : (r.error || 'Save failed'), r.ok ? 'g' : 'd'); if (currentSection === 'saves') renderSection('saves'); }
async function loadSlot(slot, fromWelcome){
  const r = await post(`/api/load/${slot}`);
  if (!r.ok) return notify(r.error === 'no_save_found' ? 'No saved game found' : (r.error || 'Load failed'), 'w');
  STATE = r; currentSection = 'dash';
  if (fromWelcome) showMain(); else refresh();
  notify(r.recovered ? `Loaded from an older auto-save (${r.loadedFrom}) — the newest was damaged.` : r.migratedFrom ? `Save upgraded from v${r.migratedFrom}. A backup of the original was kept.` : 'Game loaded', r.recovered ? 'w' : 'g');
  if (STATE.liveMatch) showHalftime(STATE.liveMatch);
}
async function deleteSlot(slot){ if (!confirm(`Delete ${slot.replace('_', ' ')}?`)) return; await api(`/api/saves/${slot}`, { method: 'DELETE' }); renderSection('saves'); }
async function exportSave(){
  const r = await api('/api/export-save');
  if (!r.ok) return notify(r.error || 'Export failed', 'd');
  const blob = new Blob([JSON.stringify({ gameState: r.gameState, meta: r.meta })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `the-gaffer-${(r.meta.club || 'save').replace(/\W+/g, '-')}-${r.meta.season.replace('/', '-')}-w${r.meta.week}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importSave(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const r = await post('/api/import-save', { gameState: data.gameState || data });
    if (!r.ok) return notify(r.error || 'Import failed', 'd');
    STATE = r; currentSection = 'dash'; refresh(); notify('Save imported', 'g');
  } catch (e) { notify('That file is not a valid save: ' + e.message, 'd'); }
}

function openMo(id){ document.getElementById(id).classList.remove('hidden'); }

function notify(msg, type = 'i'){
  const nc = document.getElementById('notif');
  const n = document.createElement('div');
  n.className = `nf nf${type}`; n.textContent = msg;
  n.onclick = () => n.remove();
  nc.appendChild(n);
  while (nc.children.length > 4) nc.firstChild.remove();
  setTimeout(() => n.classList.add('ns'), 10);
  setTimeout(() => { n.classList.remove('ns'); setTimeout(() => n.remove(), 300); }, 4500);
}

let INSTALL_EVT = null;
function IS_STANDALONE(){ try { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch { return false; } }
function IS_IOS(){ const ua = (navigator && navigator.userAgent) || ''; return /iphone|ipad|ipod/i.test(ua) || (navigator && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function canInstall(){ return !IS_STANDALONE() && (!!INSTALL_EVT || IS_IOS()); }
function syncInstallButtons(){ document.querySelectorAll('[data-install]').forEach(b => b.classList.toggle('hidden', !canInstall())); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; syncInstallButtons(); if (STATE && currentSection === 'dash') renderSection('dash'); });
window.addEventListener('appinstalled', () => { INSTALL_EVT = null; syncInstallButtons(); notify('Installed! Open The Gaffer from your home screen or apps list.', 'g'); if (STATE) refresh(); });
async function installApp(){
  if (INSTALL_EVT) {
    const ev = INSTALL_EVT;
    ev.prompt();
    const choice = await ev.userChoice.catch(() => ({ outcome: 'dismissed' }));
    INSTALL_EVT = null; syncInstallButtons();
    if (choice.outcome === 'accepted') notify('Installing The Gaffer…', 'g');
    if (STATE) refresh();
    return;
  }
  const ios = IS_IOS();
  openMo('genMo');
  document.getElementById('genMoContent').innerHTML = `<div class="mo-title">📲 Install The Gaffer</div>
    ${IS_STANDALONE() ? '<div class="small">You are already playing the installed app.</div>' : ios ? `<ol class="small" style="padding-left:18px;line-height:1.9">
      <li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button <span class="kbd">⬆︎</span> at the bottom (or top) of the screen.</li>
      <li>Scroll and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol><div class="small dim">The Gaffer then opens full screen from your home screen and keeps your career on the phone.</div>`
    : `<ol class="small" style="padding-left:18px;line-height:1.9"><li><b>Android (Chrome):</b> tap the menu <span class="kbd">⋮</span> → <b>Install app</b> or <b>Add to Home screen</b>.</li>
      <li><b>Computer (Chrome / Edge):</b> click the install icon <span class="kbd">⊕</span> at the right of the address bar, or menu → <b>Install The Gaffer</b>.</li>
      <li><b>Samsung Internet:</b> menu → <b>Add page to</b> → <b>Home screen</b>.</li></ol><div class="small dim">If the option is missing, reload once — the app needs a moment to get ready for offline play.</div>`}
    <button class="btn bp fw mt12" onclick="closeMo('genMo')">OK</button>`;
}
function installBanner(){
  if (!canInstall() || PREFS.installDismissed) return '';
  return `<div class="banner or" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="flex:1;min-width:180px">📲 <b>Install The Gaffer</b> — full screen, plays offline, opens from your home screen.</span><button class="btn bp bxs" onclick="installApp()">Install</button><button class="btn bg bxs" onclick="PREFS.installDismissed=1;savePrefs();renderSection('dash')">Later</button></div>`;
}

function radar(a){
  const keys = Object.keys(a), n = keys.length, R = 62, C = 80;
  const pt = (i, r) => [C + Math.sin(i / n * Math.PI * 2) * r, C - Math.cos(i / n * Math.PI * 2) * r];
  const ring = f => keys.map((_, i) => pt(i, R * f).map(x => x.toFixed(1)).join(',')).join(' ');
  const shape = keys.map((k, i) => pt(i, R * Math.max(0.08, a[k] / 100)).map(x => x.toFixed(1)).join(',')).join(' ');
  const lab = { pace: 'PAC', finishing: 'FIN', passing: 'PAS', dribbling: 'DRI', defending: 'DEF', strength: 'STR', vision: 'VIS', workRate: 'WRK' };
  return `<svg viewBox="0 0 160 160" width="170" height="170" role="img" aria-label="Attribute radar">${[0.33, 0.66, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="rgba(127,127,127,.3)" stroke-width="1"/>`).join('')}
    <polygon points="${shape}" fill="rgba(0,229,204,.28)" stroke="#00e5cc" stroke-width="2"/>
    ${keys.map((k, i) => { const [x, y] = pt(i, R + 12); return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="middle" font-size="8" fill="currentColor" opacity=".7">${lab[k] || esc(k.slice(0, 3).toUpperCase())}</text>`; }).join('')}</svg>`;
}

const AC_ICON = { sacked: '❌', halftime: '⏸', bid: '💰', contract: '✍️', unhappy: '😠', sponsor: '🤝', job: '📨', national: '🌐', scout: '🔭', staff: '👔', lineup: '📋', wages: '💸' };
function actionCentre(){
  const ds = STATE.decisions || [];
  const nf = STATE.nextFixture, dr = STATE.dressingRoom || {};
  const rows = ds.map(d => {
    let btns = '';
    if (d.type === 'sacked') btns = `<button class="btn bp bxs" onclick="navTo('career')">Choose club</button>`;
    else if (d.type === 'halftime') btns = `<button class="btn bp bxs" onclick="advance()">Dressing room</button>`;
    else if (d.type === 'bid') { const b = (STATE.pendingBids || []).find(x => x.id === d.id); if (!b) return ''; btns = `<button class="btn bp bxs" onclick="bidAction('${esc(b.id)}','accept')">Accept</button><button class="btn bs bxs" onclick="counterBid('${esc(b.id)}',${b.fee})">Counter</button><button class="btn br bxs" onclick="bidAction('${esc(b.id)}','reject')">Reject</button>`; }
    else if (d.type === 'contract') btns = d.blocked ? '<span class="small dim">talks blocked</span>' : `<button class="btn bp bxs" title="Pay what the agent asks" onclick="quickRenew(${d.playerId})">Renew ${money(d.wage)}/wk · ${money(d.cost)} now</button><button class="btn bg bxs" onclick="openTalks(${d.playerId})">Negotiate</button>`;
    else if (d.type === 'unhappy') btns = d.talked ? '<span class="small dim">spoken to this week</span>' : `${d.wantsOut ? `<button class="btn bp bxs" onclick="talkTo(${d.playerId},'stay')">Persuade to stay</button>` : ''}<button class="btn bs bxs" onclick="talkTo(${d.playerId},'promise')">Promise games</button><button class="btn bg bxs" onclick="talkTo(${d.playerId},'praise')">Praise</button>`;
    else if (d.type === 'sponsor') btns = (STATE.sponsorOffers || []).map((o, i) => `<button class="btn ${i === 2 ? 'bp' : 'bs'} bxs" title="${o.bonus ? `Bonus: ${money(o.bonus.promotion)} promotion, ${money(o.bonus.trophy)} per trophy` : 'No bonuses'}" onclick="acceptSponsor(${i})">${esc(o.name)} ${money(o.perSeason)}×${o.years}</button>`).join('');
    else if (d.type === 'job') btns = `<button class="btn bp bxs" onclick="navTo('career')">See offers</button>`;
    else if (d.type === 'national') btns = `<button class="btn bp bxs" onclick="act('/api/national/accept',{country:'${esc(d.country)}'},'You are now a national team manager')">Accept</button><button class="btn bg bxs" onclick="navTo('international')">Details</button>`;
    else if (d.type === 'scout') btns = `<button class="btn bs bxs" onclick="showPlayer(${d.playerId})">Report</button><button class="btn bp bxs" onclick="openTalks(${d.playerId})">Make offer</button>`;
    else if (d.type === 'staff') btns = `<button class="btn bs bxs" onclick="navTo('staff')">Hire</button>`;
    else if (d.type === 'lineup') btns = `<button class="btn bp bxs" onclick="act('/api/lineup/clear',{},'Lineup back on auto')">Auto-pick XI</button><button class="btn bg bxs" onclick="navTo('lineup')">Edit</button>`;
    else if (d.type === 'wages') btns = `<button class="btn bg bxs" onclick="navTo('finances')">Budget</button>`;
    return `<div class="ac-item"><span class="ac-ico">${AC_ICON[d.type] || '•'}</span><span class="ac-txt">${esc(d.text)}</span><div class="row">${btns}</div></div>`;
  }).join('');
  const talk = nf && !dr.teamTalkDone ? `<div class="ac-item"><span class="ac-ico">🗣</span><span class="ac-txt">Team talk before ${esc(nf.opponent)} <span class="dim">(atmosphere: ${esc(dr.label || '–')})</span></span><div class="row">${[['motivate', 'Motivate'], ['calm', 'Calm'], ['demand', 'Demand']].map(([k, l]) => `<button class="btn bg bxs" onclick="teamTalkDo('${k}')">${l}</button>`).join('')}</div></div>` : '';
  if (!rows && !talk) return `<div class="card" style="padding:10px 14px"><div class="small dim">✅ Nothing needs you right now. Press <span class="kbd">Space</span> to play on.</div></div>`;
  return `<div class="card"><div class="ch">Decisions <span class="small dim">${ds.length} pending</span></div>${rows}${talk}</div>`;
}

async function quickRenew(id){

  const d = t.demand;
  const r = await post('/api/negotiate', { playerId: id, wage: d.wage, bonus: d.bonus, agentFee: d.agentFee, years: d.years, role: d.role, releaseClause: d.wantsClause ? Math.round((findPlayer(id)?.marketValue || 1e6) * 2.5) : 0 });

// ── negotiation: transfers, free agents and renewals with the player's agent ──
async function openTalks(id){
  const t = await post('/api/negotiate', { playerId: id, dryRun: true });
  if (!t.ok) return notify(t.error, 'd');
  const d = t.demand, sign = t.kind === 'sign', p = findPlayer(id) || {};
  const ask = t.askFee || 0;
  openMo('genMo');
  document.getElementById('genMoContent').innerHTML = `
    <div class="mo-title">${sign ? (t.fromClubId ? 'Sign' : 'Sign free agent') : 'Contract talks'} · ${esc(t.player)}</div>
    <div class="small dim" style="margin-bottom:8px">Agent <b style="color:var(--tx)">${esc(d.agent.name)}</b> (${esc(d.agent.style)}) · patience: <span id="ngPat">${t.patience - t.round}</span> round${t.patience - t.round === 1 ? '' : 's'} left${t.blocked ? ' · <b style="color:var(--rd)">refuses to talk this month</b>' : ''}</div>
    ${sign && t.fromClubId ? `<div class="card" style="padding:10px"><div class="ch">Transfer fee to ${esc(t.fromClub)}</div>
      <input type="range" id="ngFee" min="${Math.round(ask * 0.4)}" max="${Math.round(ask * 2.5) || 100000}" value="${ask}" step="${Math.max(1000, Math.round(ask * 0.02))}" oninput="ngSum()" style="padding:0">
      <div class="sr" style="border:none"><span class="small dim">Asking price ~${money(ask)}</span><b id="ngFeeV">${money(ask)}</b></div></div>` : ''}
    <div class="card" style="padding:10px"><div class="ch">Personal terms <span class="small dim">agent asks</span></div>
      <div class="g2">
        <div><label class="lbl">Weekly wage <span class="dim" id="ngDW">(${money(d.wage)})</span></label><input type="number" id="ngWage" value="${d.wage}" min="0" step="10" oninput="ngSum()"></div>
        <div><label class="lbl">Contract years <span class="dim">(${d.years})</span></label><select id="ngYears">${[1, 2, 3, 4, 5].map(y => `<option ${y === d.years ? 'selected' : ''}>${y}</option>`).join('')}</select></div>
        <div><label class="lbl">Signing bonus <span class="dim" id="ngDB">(${money(d.bonus)})</span></label><input type="number" id="ngBonus" value="${d.bonus}" min="0" step="100" oninput="ngSum()"></div>
        <div><label class="lbl">Agent fee <span class="dim" id="ngDA">(${money(d.agentFee)})</span></label><input type="number" id="ngAgent" value="${d.agentFee}" min="0" step="100" oninput="ngSum()"></div>
        <div><label class="lbl">Squad role <span class="dim">(expects ${esc((t.roles.find(r => r.id === d.role) || {}).label || d.role)})</span></label><select id="ngRole">${t.roles.map(r => `<option value="${r.id}" ${r.id === d.role ? 'selected' : ''}>${esc(r.label)}</option>`).join('')}</select></div>
        <div><label class="lbl">Release clause ${d.wantsClause ? '<span style="color:var(--or)">(he wants one)</span>' : '<span class="dim">(optional)</span>'}</label><input type="number" id="ngClause" value="${d.wantsClause ? Math.round((p.marketValue || ask || 500000) * 2.5 / 1000) * 1000 : 0}" min="0" step="1000"></div>
      </div>
      <div class="small dim mt4">Promising a bigger role lowers his demands — but a broken promise hurts him and the dressing room. A cheap release clause lets any club take him.</div></div>
    <div class="card small" id="ngSum"></div>
    <div id="ngMsg" class="small" style="margin-bottom:8px"></div>
    <button class="btn bp fw" onclick="sendOffer(${id},false)">Make this offer</button>
    <button class="btn bs fw mt4" onclick="sendOffer(${id},true)">Meet every demand</button>
    <button class="btn bg fw mt4" onclick="closeMo('genMo')">Walk away</button>`;
  window.NG = { t, d };
  ngSum();
}
function ngVal(id){ const el = document.getElementById(id); return el ? Math.max(0, Math.round(+el.value || 0)) : 0; }
function ngSum(){
  const ng = window.NG; if (!ng) return;
  const fee = ngVal('ngFee'), now = fee + ngVal('ngBonus') + ngVal('ngAgent'), wage = ngVal('ngWage');
  const fv = document.getElementById('ngFeeV'); if (fv) fv.textContent = money(fee);
  const room = STATE.budget ? STATE.budget.wageHeadroom : 0;
  const extra = ng.t.kind === 'renew' ? wage - (ng.t.currentWage || 0) : wage;
  const el = document.getElementById('ngSum'); if (!el) return;
  el.innerHTML = `<div class="sr"><span>Paid now (fee + bonus + agent)</span><b style="color:${now <= STATE.finances ? 'var(--tx)' : 'var(--rd)'}">${money(now)}</b></div>
    <div class="sr"><span>Wage bill change</span><b style="color:${extra <= room ? 'var(--gr)' : 'var(--or)'}">${extra >= 0 ? '+' : ''}${money(extra)}/wk</b></div>
    <div class="sr"><span>Wage budget room</span><span>${money(room)}/wk · transfer budget ${money(STATE.transferBudget)}</span></div>`;
}
async function sendOffer(id, meet){
  const ng = window.NG; if (!ng) return;
  const d = ng.d;
  const body = meet ? { wage: d.wage, bonus: d.bonus, agentFee: d.agentFee, years: d.years, role: d.role, releaseClause: ngVal('ngClause') }
    : { wage: ngVal('ngWage'), bonus: ngVal('ngBonus'), agentFee: ngVal('ngAgent'), years: ngVal('ngYears'), role: document.getElementById('ngRole').value, releaseClause: ngVal('ngClause') };
  body.playerId = id;
  if (document.getElementById('ngFee')) body.fee = ngVal('ngFee');
  const r = await post('/api/negotiate', body);
  applyCurrent(r);
  const msg = document.getElementById('ngMsg');
  if (r.ok) { closeMo('genMo'); sfx('deal'); notify(ng.t.kind === 'renew' ? `${r.player} signed a new contract` : `${r.player} signed${r.acceptedFee ? ` for ${money(r.acceptedFee)}` : ''}!`, 'g'); window.NG = null; return refresh(); }
  if (r.action === 'counter' && r.demand) {
    ng.d = r.demand;
    document.getElementById('ngWage').value = r.demand.wage; document.getElementById('ngBonus').value = r.demand.bonus; document.getElementById('ngAgent').value = r.demand.agentFee;
    document.getElementById('ngDW').textContent = `(${money(r.demand.wage)})`; document.getElementById('ngDB').textContent = `(${money(r.demand.bonus)})`; document.getElementById('ngDA').textContent = `(${money(r.demand.agentFee)})`;
    document.getElementById('ngPat').textContent = Math.max(0, (r.patience || 1) - (r.round || 0));
    msg.innerHTML = `<span style="color:var(--or)">${esc(r.error)}</span> New demands filled in.`; ngSum(); return;
  }
  if (r.action === 'counter' && r.counterFee) { const f = document.getElementById('ngFee'); if (f) f.value = r.counterFee; ngSum(); msg.innerHTML = `<span style="color:var(--or)">The club wants ${money(r.counterFee)}.</span> Fee updated — offer again to accept.`; return; }
  if (r.action === 'rejected') { msg.innerHTML = `<span style="color:var(--rd)">Fee rejected.</span> They will not sell below about ${money(r.minFee)}.`; return; }
  closeMo('genMo'); window.NG = null; notify(r.error || 'No deal', 'd'); refresh();
}
