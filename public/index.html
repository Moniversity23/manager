  <div class="banner or small">You only see exact ratings for your own players. Everyone else shows a range — narrower in your own league, wide abroad. Scout a player for a full report; a better chief scout (Staff) adds scouts and speeds up reports.</div>
  <div class="g2"><div>
    <div class="card"><div class="ch">On assignment</div>${sc.assignments.map(a => `<div class="lbr"><div style="flex:1"><a href="#" onclick="showPlayer(${a.playerId});return false" style="color:var(--tx);font-weight:600">${esc(a.name)}</a> <span class="small dim">${esc(a.position)} · ${a.age} · ${esc(a.club)}</span><div class="meter mt4"><span style="width:${a.known}%;background:var(--ac)"></span></div><div class="small dim">${a.known}% known · report in ~${a.weeksLeft} wk</div></div><button class="btn bg bxs" onclick="act('/api/scout/cancel',{playerId:${a.playerId}},'Assignment cancelled')">Stop</button></div>`).join('') || '<div class="small dim">No scouts out. Use 🔭 next to any player in Transfers, Leagues or a club squad.</div>'}</div>
    <div class="card"><div class="ch">Find players</div><div class="row"><button class="btn bs bsm" onclick="navTo('transfers')">Transfer market</button><button class="btn bs bsm" onclick="navTo('leagues')">Browse leagues</button><button class="btn bs bsm" onclick="navTo('academy')">Regional youth trips</button></div></div>
  </div><div>
    <div class="card"><div class="ch">Reports</div>${(sc.reports || []).map(r => `<div class="lbr"><div style="flex:1"><a href="#" onclick="showPlayer(${r.playerId});return false" style="color:var(--tx);font-weight:600">${esc(r.name)}</a> <span class="small dim">${esc(r.position)} · ${r.age} · S${r.season} W${r.week}</span><div class="small">Ability <b>${r.ovr}</b> · potential <b>${r.pot}</b> · ${esc(r.personality)} ${verdictTag(r.verdict)}</div></div><button class="btn bp bxs" onclick="openTalks(${r.playerId})">Offer</button></div>`).join('') || '<div class="small dim">Finished reports appear here and in your inbox.</div>'}</div>
  </div></div>`;
}

// ── dressing room ──
function rDressing(){
  const dr = STATE.dressingRoom || { players: [] };
  const col = dr.morale >= 62 ? 'var(--gr)' : dr.morale >= 45 ? 'var(--or)' : 'var(--rd)';
  return `<div class="sct">Dressing Room <span class="scs">atmosphere ${esc(dr.label || '–')}</span></div>
  <div class="g2"><div>
    <div class="card"><div class="ch">Atmosphere</div><div class="sr"><span>Average morale</span><b style="color:${col}">${dr.morale ?? '–'}/100 · ${esc(dr.label || '')}</b></div><div class="meter mt4"><span style="width:${dr.morale || 0}%;background:${col}"></span></div>
      <div class="sr mt8"><span>Captain</span><b>${dr.captain ? esc(dr.captain.name) : '—'}</b></div><div class="sr"><span>Leaders</span><span>${esc((dr.leaders || []).join(', ') || 'none')}</span></div>
      <div class="small dim mt8">Morale feeds match strength. Players judge their playing time against the role they expect (or you promised), compare wages, and follow the leaders. Four weeks below 35 and they ask to leave.</div></div>
  </div><div>
    <div class="card"><div class="ch">Team talk this week</div>${dr.teamTalkDone ? '<div class="small dim">Done for this week.</div>' : `<div class="row">${[['motivate', 'Motivate', 'Lifts most players'], ['calm', 'Calm', 'Settles unhappy players'], ['demand', 'Demand more', 'Tough characters love it; the temperamental do not']].map(([k, l, d]) => `<button class="btn bs bsm" title="${d}" onclick="teamTalkDo('${k}')">${l}</button>`).join('')}</div>`}</div>
  </div></div>
  <div class="card" style="overflow-x:auto;padding:0"><table class="st" style="min-width:760px"><thead><tr><th>PLAYER</th><th class="tc">MORALE</th><th>ROLE</th><th class="tc">PLAYING TIME</th><th>ISSUES</th><th>TALK</th></tr></thead><tbody>
  ${dr.players.map(p => `<tr><td><a href="#" onclick="showPlayer(${p.id});return false" style="color:var(--tx);font-weight:600">${esc(p.name)}</a> <span class="small dim">${esc(p.position)} · ${esc(p.personality)}</span></td>
    <td class="tc"><b style="color:${p.morale >= 65 ? 'var(--gr)' : p.morale >= 45 ? 'var(--or)' : 'var(--rd)'}">${p.morale}</b></td>
    <td class="small">${esc(p.roleLabel)}${p.promise ? ` <span class="tag ${p.promise.broken ? 'tr' : 'to'}">${p.promise.broken ? 'BROKEN PROMISE' : 'PROMISED'}</span>` : ''}</td>
    <td class="tc small">${p.share == null ? '<span class="dim">–</span>' : `<span style="color:${p.share >= p.need ? 'var(--gr)' : 'var(--rd)'}">${p.share}%</span> <span class="dim">/ ${p.need}%</span>`}</td>
    <td class="small">${p.wantsOut ? '<span class="tag tr">WANTS OUT</span> ' : ''}${esc((p.unhappy || []).join(', '))}</td>
    <td>${p.talked ? '<span class="small dim">spoken</span>' : `<div class="row">${[['praise', '👍'], ['demand', '☝️'], ['promise', '🤝'], ...(p.wantsOut ? [['stay', '🙏']] : [])].map(([k, ic]) => `<button class="btn bg bxs" title="${k}" onclick="talkTo(${p.id},'${k}')">${ic}</button>`).join('')}</div>`}</td></tr>`).join('')}
  </tbody></table></div><div class="small dim">👍 praise · ☝️ demand more · 🤝 promise more games · 🙏 persuade to stay. One talk per player per week.</div>`;
}

// ── news ──
let NEWS_FILTER = 'all', NEWS_CACHE = null;
function rNews(){
  const items = (NEWS_CACHE && NEWS_CACHE.filter === NEWS_FILTER ? NEWS_CACHE.items : (STATE.news || []).filter(n => NEWS_FILTER === 'all' || (NEWS_FILTER === 'transfers' ? n.kind === 'transfer' : { club: ['club'], league: ['club', 'league'], nation: ['club', 'league', 'nation'] }[NEWS_FILTER].includes(n.scope))));
  const lead = items[0];
  return `<div class="sct">The Gaffer Gazette <span class="scs">${esc(STATE.seasonLabel)} · week ${STATE.week}</span></div>
  <div class="row" style="margin-bottom:10px">${[['all', 'Everything'], ['club', 'My club'], ['league', 'My league'], ['nation', 'My country'], ['transfers', 'Transfers']].map(([k, l]) => `<button class="btn bsm ${NEWS_FILTER === k ? 'bact' : 'bg'}" onclick="newsFilter('${k}')">${l}</button>`).join('')}</div>
  ${lead ? `<div class="card"><div class="news-kind">${esc(lead.kind)} · S${lead.season} W${lead.week}</div><div class="news-lead">${esc(lead.headline)}</div><div class="small">${esc(lead.text)}</div></div>` : '<div class="card small dim">No news yet — play a week.</div>'}
  <div class="card">${items.slice(1).map(n => `<div class="news-item"><div class="news-kind">${esc(n.kind)} · S${n.season} W${n.week}</div><h4>${esc(n.headline)}</h4><div class="small dim">${esc(n.text)}</div></div>`).join('') || '<div class="small dim">Nothing else to report.</div>'}</div>`;
}
async function newsFilter(f){
  NEWS_FILTER = f;
  const r = await api('/api/news?filter=' + encodeURIComponent(f));
  if (r && r.ok) NEWS_CACHE = { filter: f, items: r.news };
  renderSection('news');
}

// ── international ──
let NAT_PICK = null;
function rInternational(){
  const it = STATE.international;
  if (!it) return '<div class="sct">International</div><div class="card small dim">International football starts with the next season.</div>';
  const job = it.job;
  const myNation = job ? job.country : STATE.country;
  const groupTable = g => `<table class="st"><thead><tr><th>#</th><th>Nation</th><th class="tc">P</th><th class="tc">W</th><th class="tc">D</th><th class="tc">L</th><th class="tc">GD</th><th class="tc">Pts</th></tr></thead><tbody>${g.rows.map(r => `<tr class="${r.country === myNation ? 'hlr' : ''}"><td>${r.pos}</td><td>${esc(r.country)}</td><td class="tc">${r.p}</td><td class="tc">${r.w}</td><td class="tc">${r.d}</td><td class="tc">${r.l}</td><td class="tc">${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="tc"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`;
  if (job && !NAT_PICK) NAT_PICK = new Set((job.pool || []).filter(p => p.picked).map(p => p.id));
  return `<div class="sct">International <span class="scs">${it.nextWeek ? `next international week: ${it.nextWeek}` : 'no more international matches this season'}</span></div>
  ${(it.offers || []).map(o => `<div class="banner or">🌐 <b>${esc(o.country)}</b> (ranked ${o.rank}) want you as national team manager — alongside your club job. <button class="btn bp bxs" onclick="act('/api/national/accept',{country:'${esc(o.country)}'},'National team job accepted')">Accept</button></div>`).join('')}
  <div class="g2"><div>
    ${job ? `<div class="card"><div class="ch">${esc(job.country)} — your national team <button class="btn br bxs" onclick="if(confirm('Resign as national team manager?'))act('/api/national/leave',{},'You resigned')">Resign</button></div>
      <div class="sr"><span>Record</span><b>${job.won}W ${job.drawn}D ${job.lost}L</b></div><div class="sr"><span>Form</span><span>${(job.form || []).map(r => `<span class="fw-${r}">${r}</span>`).join(' ') || '–'}</span></div>
      <div class="ch mt8">Squad (${NAT_PICK.size}/23) <span><button class="btn bs bxs" onclick="saveNatSquad()">Save squad</button><button class="btn bg bxs" onclick="NAT_PICK=new Set();saveNatSquad()">Federation picks</button></span></div>
      <div style="max-height:280px;overflow-y:auto">${(job.pool || []).map(p => `<label class="sr" style="cursor:pointer"><span><input type="checkbox" style="width:auto;margin-right:6px" ${NAT_PICK.has(p.id) ? 'checked' : ''} onchange="natToggle(${p.id},this.checked)">${esc(p.name)} <span class="small dim">${esc(p.position)} · ${p.age} · ${esc(p.club)}</span></span><b>${p.ovr}</b></label>`).join('')}</div>
      <div class="small dim mt4">Leave it empty and the federation picks the best 23 for every match.</div></div>` : ''}
    <div class="card"><div class="ch">Your players on international duty</div>${(it.callups || []).map(c => `<div class="sr"><span>${esc(c.name)}</span><span class="small dim">${esc(c.country)}</span></div>`).join('') || '<div class="small dim">None at the last international break.</div>'}<div class="small dim mt4">Called-up players come back tired, and sometimes injured.</div></div>
    <div class="card"><div class="ch">World rankings</div>${it.rankings.map(r => `<div class="sr"><span>${r.rank}. ${esc(r.country)}${r.country === myNation ? ' <span class="tag ta">YOU</span>' : ''}</span><span style="font-family:var(--fm)">${r.elo}</span></div>`).join('')}</div>
  </div><div>
    <div class="card"><div class="ch">Nations League ${STATE.seasonLabel}</div>${it.groups.map(g => `<div class="small dim mt8">Group ${esc(g.name)}</div>${groupTable(g)}`).join('')}
      <div class="ch mt12">Fixtures</div>${it.weeks.map(w => `<div class="small dim mt4">Week ${w}</div>${it.fixtures.filter(f => f.week === w).map(f => `<div class="sr small"><span>${esc(f.h)} <b>${f.score || 'v'}</b> ${esc(f.a)}</span><span class="dim">Group ${esc(f.group)}</span></div>`).join('')}`).join('')}
      <div class="sr mt8"><span>Final (week ${it.finalWeek})</span><b>${it.final ? `${esc(it.final.h)} ${esc(it.final.score)} ${esc(it.final.a)} → ${esc(it.final.winner)}` : 'Group winners meet'}</b></div></div>
    <div class="card"><div class="ch">World Nations Cup</div><div class="small dim">The top eight nations, every second summer. Next: end of ${it.nextWnc}/${it.nextWnc + 1}.</div>
      ${it.wnc ? `<div class="small mt8">${it.wnc.season}: <b>${esc(it.wnc.winner)}</b></div>${it.wnc.rounds.map(r => `<div class="small dim mt4">${esc(r.name)}</div>${r.ties.map(t => `<div class="small">${esc(t.h)} ${esc(t.score)} ${esc(t.a)}</div>`).join('')}`).join('')}` : ''}</div>
    <div class="card"><div class="ch">Honours</div>${(it.winners || []).map(w => `<div class="sr small"><span>${w.season} ${esc(w.comp)}</span><b>${esc(w.winner)}</b></div>`).join('') || '<div class="small dim">No winners yet.</div>'}</div>
  </div></div>`;
}
function natToggle(id, on){ if (!NAT_PICK) NAT_PICK = new Set(); if (on) NAT_PICK.add(id); else NAT_PICK.delete(id); }
async function saveNatSquad(){ const r = await post('/api/national/squad', { playerIds: [...(NAT_PICK || [])] }); applyCurrent(r); notify(r.ok ? (r.picked ? `Squad saved (${r.picked})` : 'The federation will pick the squad') : r.error, r.ok ? 'g' : 'd'); NAT_PICK = null; refresh(); }

// ── challenges (prize money) ──
function rChallenges(){
  const ch = STATE.challenges || {};
  const st = s => s === 'done' ? '<span class="tag tg">DONE</span>' : s === 'failed' ? '<span class="tag tr">MISSED</span>' : s === 'void' ? '<span class="tag dim">NO MATCH</span>' : '<span class="tag to">OPEN</span>';
  return `<div class="sct">Challenges <span class="scs">${ch.completed || 0} completed · prize money paid automatically</span></div>
  <div class="g2"><div>
    <div class="card"><div class="ch">This week</div>${ch.weekly ? `<div class="sr"><span>${esc(ch.weekly.text)}</span>${st(ch.weekly.status)}</div><div class="small dim">Prize ${money(ch.weekly.cash)} — paid automatically.</div>` : '<div class="small dim">No match this week.</div>'}</div>
    <div class="card"><div class="ch">This season</div>${(ch.season || []).map(c => `<div class="sr"><span>${esc(c.text)}${c.cash ? ` <span class="small dim">${money(c.cash)}</span>` : ''}</span>${st(c.status)}</div>`).join('') || '<div class="small dim">Set at the start of each season.</div>'}</div>
  </div><div>
    <div class="card"><div class="ch">Recent</div>${(ch.history || []).slice(0, 10).map(c => `<div class="sr small"><span>${esc(c.text)} <span class="dim">S${c.season}${c.week ? ' W' + c.week : ''}</span></span>${st(c.status)}</div>`).join('') || '<div class="small dim">Nothing yet.</div>'}</div>
  </div></div>`;
}

// ── finances: season budget ──
function budgetCard(){
  const b = STATE.budget; if (!b) return '';
  const parts = [['tv', 'TV', 'var(--bl)'], ['sponsor', 'Shirt sponsor', 'var(--ac)'], ['merchandise', 'Merchandise', 'var(--gold)'], ['gates', 'Gate receipts', 'var(--gr)'], ['prize', 'Prize money', 'var(--or)']];
  const tot = b.seasonIncome || 1;
  const sp = b.sponsor || {};
  return `<div class="card"><div class="ch">Season budget <span class="small dim">${b.weeksLeft} weeks left · ${b.homeLeft} home games</span></div>
    <div class="g4" style="margin-bottom:10px">${kpi(money(b.transferBudget), 'Transfer budget', b.frozen ? 'Frozen by the board' : 'Spend without ending in debt', 'var(--ac)')}${kpi(money(b.wageBudget) + '/wk', 'Wage budget', `using ${money(b.wages)} · room ${money(b.wageHeadroom)}`, b.wageHeadroom > 0 ? 'var(--gr)' : 'var(--rd)')}${kpi(money(b.projected), 'Projected end balance', 'if nothing changes', b.projected >= 0 ? 'var(--gr)' : 'var(--rd)')}${kpi(money(b.seasonIncome), 'Season income', 'full season estimate', 'var(--bl)')}</div>
    <div class="small dim">Where the money comes from (full season)</div>
    <div class="bar-h">${parts.map(([k, , c]) => `<span style="width:${Math.max(0, (b.season[k] || 0) / tot * 100)}%;background:${c}" title="${k}"></span>`).join('')}</div>
    <div class="row small">${parts.map(([k, l, c]) => `<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c}"></span> ${l} ${money(b.season[k] || 0)} (${Math.round((b.season[k] || 0) / tot * 100)}%)</span>`).join('')}</div>
    <div class="sr mt8"><span>🤝 ${sp.name ? `${esc(sp.name)} — ${money(sp.perSeason)}/season, ${sp.yearsLeft} season${sp.yearsLeft === 1 ? '' : 's'} left` : `No shirt deal signed — base sponsorship ${money(sp.perSeason)}/season`}</span><b>${sp.share}% of income</b></div>
    ${sp.bonus ? `<div class="small dim">Bonuses: ${money(sp.bonus.promotion)} for promotion · ${money(sp.bonus.trophy)} per trophy.</div>` : ''}
    <div class="g2 mt8"><div>${Object.entries(b.income).map(([k, v]) => `<div class="sr small"><span>${k}</span><span class="up">+${money(v)}</span></div>`).join('')}</div><div>${Object.entries(b.costs).map(([k, v]) => `<div class="sr small"><span>${k}</span><span class="dn">-${money(v)}</span></div>`).join('')}</div></div></div>`;
}
function sponsorRow(o, i){ return `<div class="lbr"><div style="flex:1">${esc(o.name)}<div class="small dim">${money(o.perSeason)} a season for ${o.years} season${o.years > 1 ? 's' : ''}${o.bonus ? ` · bonus ${money(o.bonus.promotion)} promotion, ${money(o.bonus.trophy)} per trophy` : ' · no bonuses'}</div></div><button class="btn bp bxs" onclick="acceptSponsor(${i})">Sign</button></div>`; }

// ── settings: delegation, offline, shortcuts ──
function settingsExtra(){
  const dg = STATE.delegate || {};
  const tog = (k, l, d) => `<div class="sr"><span>${l}<div class="small dim">${d}</div></span><button class="btn bsm ${dg[k] ? 'bact' : 'bg'}" onclick="post('/api/delegate',{${k}:${!dg[k]}}).then(r=>{applyCurrent(r);renderSection('settings')})">${dg[k] ? 'Assistant' : 'Me'}</button></div>`;
  return `<div class="card"><div class="ch">Delegate to your assistant</div>
      ${tog('contracts', 'Key contracts', 'Renews top-16 players in their final year on the agent’s terms')}
      ${tog('bids', 'Bids for your players', 'Turns down bids for key players; sells listed players at value')}</div>
    <div class="card"><div class="ch">Where the game runs</div>
      <div class="sr"><span>Now</span><b>${MODE === 'offline' ? 'Offline — in this browser' : 'Server'}</b></div>
      <div class="small dim" style="margin-bottom:8px">Offline mode runs the whole game in your browser, with saves on this device. It also starts automatically when the server is unreachable.</div>
      ${MODE === 'offline' ? `<button class="btn bs bsm" onclick="switchMode('server',true)">Move this career to the server</button>` : `<button class="btn bs bsm" onclick="switchMode('offline',true)">Play this career offline</button>`}</div>
    <div class="card"><div class="ch">Install as an app</div>${IS_STANDALONE() ? '<div class="small">✅ You are playing the installed app.</div>' : `<div class="small dim" style="margin-bottom:8px">Full screen, its own icon on your home screen or desktop, and it plays without a connection.</div><button class="btn bac bsm" onclick="installApp()">📲 Install The Gaffer</button>`}</div>
    <div class="card"><div class="ch">Keyboard shortcuts</div><div class="small">${SHORTCUTS.map(([k, l]) => `<div class="sr"><span>${l}</span><span class="kbd">${k}</span></div>`).join('')}</div></div>`;
}
async function switchMode(target, carry){
  const ex = carry && STATE ? await api('/api/export-save') : null;
  if (target === 'offline' && !startWorker()) return notify('This browser cannot run the offline engine', 'd');
  if (target === 'server' && !(await serverAlive())) return notify('The server is not reachable', 'd');
  MODE = target; PREFS.mode = target; savePrefs();
  if (ex && ex.ok) { const r = await post('/api/import-save', { gameState: ex.gameState }); if (r && r.hasCareer) STATE = r; }
  notify(target === 'offline' ? 'Playing offline — saves stay in this browser' : 'Back on the server', 'g');
  refresh();
}

// ── keyboard ──
const SHORTCUTS = [['Space', 'Continue / play the week'], ['Esc', 'Close the window'], ['Backspace', 'Go back'], ['H', 'Home'], ['I', 'Inbox'], ['N', 'News'], ['S', 'Squad'], ['D', 'Dressing room'], ['L', 'Lineup'], ['T', 'Tactics'], ['M', 'Transfer market'], ['F', 'Finances'], ['C', 'Career'], ['X', 'Sound on/off']];
function onKey(e){
  const tag = (e.target && e.target.tagName) || '';
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey || !STATE) return;
  const moOpen = !document.getElementById('genMo').classList.contains('hidden');
  if (e.key === 'Escape') { if (PICK) closePicker(); else if (moOpen && !VIEW && !STATE.liveMatch) closeMo('genMo'); return; }
  if (e.key === 'Backspace') { e.preventDefault(); goBack(); return; }
  if (PICK) return;
  if (moOpen) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); return; }
  const map = { h: 'dash', i: 'inbox', n: 'news', s: 'squad', d: 'dressing', l: 'lineup', t: 'tactics', m: 'transfers', f: 'finances', c: 'career' };
  const k = e.key.toLowerCase();
  if (map[k]) navTo(map[k]);
  else if (k === 'x') toggleSound();
}
document.addEventListener('keydown', onKey);
</script>
<script src="ball.js" defer></script>
<script src="sound.js" defer></script>
<script src="commentary.js" defer></script>
